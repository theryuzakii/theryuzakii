<svg xmlns="http://www.w3.org/2000/svg" width="900" height="322" viewBox="0 0 900 322" role="img" aria-label="nm -C libryuzaki.so --defined-only" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#1C1C1C" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="898" height="320" rx="18" fill="url(#bg)" stroke="#262626"/>
  <rect x="1" y="1" width="898" height="320" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect x="1" y="1" width="898" height="320" rx="18" fill="url(#glow)"/>

  <g transform="translate(852 32)">
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="16" cy="0" r="3.5" fill="#FFFFFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="32" cy="0" r="3.5" fill="#FFFFFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <text x="36" y="52" fill="#FFFFFF">$<tspan fill="#E6E6E6"> nm -C libryuzaki.so --defined-only</tspan></text>

    <g>
      <text x="36"  y="98" fill="#555555">0x00000010</text>
      <text x="124" y="98" fill="#8A8A8A">T</text>
      <text x="148" y="98" fill="#A8A8A8">ryuzaki::<tspan fill="#F0F0F0">pytorch::train(Model&amp;)</tspan></text>
      <text x="430" y="98" fill="#7A7A7A">// ddp, fp16, expandable segments, no OOM drama</text>
    </g>
    <g>
      <text x="36"  y="124" fill="#555555">0x00000024</text>
      <text x="124" y="124" fill="#8A8A8A">T</text>
      <text x="148" y="124" fill="#A8A8A8">ryuzaki::<tspan fill="#F0F0F0">rwkv7::forward(Tensor&amp; x)</tspan></text>
      <text x="430" y="124" fill="#7A7A7A">// rwkv-v7, linear attention, O(1) state</text>
    </g>
    <g>
      <text x="36"  y="150" fill="#555555">0x00000038</text>
      <text x="124" y="150" fill="#8A8A8A">T</text>
      <text x="148" y="150" fill="#A8A8A8">ryuzaki::<tspan fill="#F0F0F0">cuda::kernel(half* ptr)</tspan></text>
      <text x="430" y="150" fill="#7A7A7A">// bf16 -&gt; fp16, sm_75 tuning, clampw</text>
    </g>
    <g>
      <text x="36"  y="176" fill="#555555">0x0000004c</text>
      <text x="124" y="176" fill="#8A8A8A">T</text>
      <text x="148" y="176" fill="#A8A8A8">ryuzaki::<tspan fill="#F0F0F0">data::tokenize(Corpus&amp;)</tspan></text>
      <text x="430" y="176" fill="#7A7A7A">// tokenizers, train.bin, hf datasets</text>
    </g>
    <g>
      <text x="36"  y="202" fill="#555555">0x00000060</text>
      <text x="124" y="202" fill="#8A8A8A">T</text>
      <text x="148" y="202" fill="#A8A8A8">ryuzaki::<tspan fill="#F0F0F0">ckpt::push(HfApi&amp;)</tspan></text>
      <text x="430" y="202" fill="#7A7A7A">// checkpoints to the hub, resume anytime</text>
    </g>
    <g>
      <text x="36"  y="228" fill="#555555">0x00000074</text>
      <text x="124" y="228" fill="#8A8A8A">T</text>
      <text x="148" y="228" fill="#A8A8A8">ryuzaki::<tspan fill="#F0F0F0">eval::loss(Logits&amp;)</tspan></text>
      <text x="430" y="228" fill="#7A7A7A">// loss curves don't lie</text>
    </g>
    <g opacity="0.5">
      <text x="36"  y="254" fill="#555555">0x0000ffff</text>
      <text x="124" y="254" fill="#8A8A8A">T</text>
      <text x="148" y="254" fill="#A8A8A8">ryuzaki::<tspan fill="#F0F0F0">sleep()</tspan></text>
      <text x="430" y="254" fill="#7A7A7A">// never called</text>
    </g>

    <text x="36" y="292" fill="#FFFFFF">$</text>
    <rect x="48" y="282" width="8" height="13" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(36 306)">
    <rect x="0" y="0" width="828" height="1" fill="#262626"/>
    <rect x="0" y="-1" width="180" height="3" rx="1.5" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" values="0 0;648 0;0 0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
